# Org Kit override (org-setup). Before building, checks for the architecture guardrails Da Vinci agrees with the
# user (docs/architecture/architecture.md) and offers them first when there are none. Loads the architecture principles and the
# org and project standards as persistent facts. Once done, checks the work against the agreed architecture answers
# (Da Vinci's stack-check.py), asks the end-of-epic AI feedback for every finished epic, and offers Scrooge McDuck's
# project close-out once every epic and story is done.
[workflow]
activation_steps_prepend = [
  "Check for the architecture file at docs/architecture/architecture.md (relative to the project root). If it exists, carry on and say nothing about it. If it does not exist, stop before any code is written and tell the user that no architecture guardrails have been agreed for this project yet. Offer Da Vinci's guardrails round first (the agent-davinci skill): he settles the architecture questions with them, asking only what the project's documents leave open, and writes docs/architecture/architecture.md with one file per cloud provider beside it, which the architecture and everything built on it then follow. Suggest a fresh session (/clear, then 'Da Vinci, set the architecture principles'), then running this workflow again. Continue without them only if the user explicitly says so, and then note in the story or change that no architecture principles were agreed. In headless mode never stop: continue and record the missing principles the same way.",
]
persistent_facts = [
  "file:docs/architecture/*.md",
  "file:docs/standards/*.md",
]
on_complete = "First, the architecture check: run `uv run .claude/skills/agent-davinci/scripts/stack-check.py {project-root}` (Da Vinci's script; resolve {project-root} to the project folder). It holds the project's code, pipelines and infrastructure against every answer in docs/architecture/architecture.md and the provider files beside it: the cloud, regions, tags, application type, front end, back end, database, AI and analytics platforms, CI, CD/GitOps, source host, IaC, environments, scans and pipeline credentials. If it reports off_stack (a tool, platform or credential the answers didn't agree) or a missing scan while pipelines exist, list each with its files and what was agreed, and don't call the work finished: offer to redo it the agreed way. Keep it only if the user explicitly says so, and then tell them the exception belongs in the principles (Da Vinci, capability AP), since the check will keep flagging it. Mention each warning (a region, tag or environment the answers don't name) in one line. Then hold the changes made in this work against each judge item (what files can't show: service model, policies, pillar ranking, security level, naming, architecture style, migration, push or pull deploys, branching, gates and release strategy) and every principle, and name any they break. Say nothing about the check when it is compliant with nothing to report, or when there is no architecture.md yet. Then, the end-of-epic AI feedback: run `uv run .claude/skills/agent-scrooge/scripts/ai_feedback.py {project-root} pending` (Scrooge McDuck's script; resolve {project-root} to the project folder). For each epic it lists under pending (a finished epic nobody has rated yet), ask the user, one epic at a time, as a multiple-choice question: 'How would you rate the AI on <epic> (its number and title), from 1 (very poor) to 5 (excellent)?'. Only if the rating is 1 or 2 (poor), ask a second question, allowing more than one answer: 'What went wrong?' with the options AI coding standard not up to quality; AI testing standards not up to quality; AI decision-making was flawed; AI answers were not grounded in company data; Poor AI security / compliance suggestions; Other (please specify), and for Other ask what it was. Record the answer with `... ai_feedback.py {project-root} record --epic <n> --rating <1-5>` plus, for a poor rating, one `--category` per answer (coding, testing, decisions, grounding, security, other) and `--other '<their words>'` for Other. If the user declines to rate, record it with `--skip` so they are not asked again. If the script answers invalid, fix the answer from its errors (ask again if needed) and record it. Say nothing about feedback when nothing is pending. Then check whether the project's delivery is finished: read the sprint status (_bmad-output/implementation-artifacts/sprint-status.yaml, or wherever the project keeps sprint-status.yaml). Only if every epic and every story in it is done, and the project has not been closed out yet (no estimate model *.estimate.json in the org config's cost_estimates_folder, default docs/costing, has a close_out entry), ask the user once whether Scrooge McDuck (the agent-scrooge skill) should close out the project now: how long it took from the first BMad stage to the last epic, the total Claude API calls and their cost at Claude's list prices, added to the cost estimate workbook for the dashboard. Suggest a fresh session (/clear, then 'Scrooge, close out the project'); start Scrooge here only on an explicit yes. If anything is still open, or the close-out exists, say nothing about it."
