# Org Kit override (org-setup). Loads the architecture principles and the org and project standards as
# persistent facts, reports work that breaks the agreed architecture answers (Da Vinci's stack-check.py), and offers
# Scrooge McDuck's project close-out once every epic and story is done. Unattended, so it never asks the
# end-of-epic AI feedback; it only says an epic is waiting to be rated.
[workflow]
persistent_facts = [
  "file:docs/architecture/*.md",
  "file:docs/standards/*.md",
]
on_complete = "First, the architecture check: run `uv run .claude/skills/agent-davinci/scripts/stack-check.py {project-root}` (Da Vinci's script; resolve {project-root} to the project folder). It holds the project's code, pipelines and infrastructure against every answer in docs/architecture/architecture.md and the provider files beside it: the cloud, regions, tags, application type, front end, back end, database, AI and analytics platforms, CI, CD/GitOps, source host, IaC, environments, scans and pipeline credentials. This loop runs unattended, so never ask: put each off_stack item and each missing scan (with pipelines present) at the top of your summary as work that breaks the architecture principles and must be redone the agreed way, then the warnings in one line each, then any judge item or principle this work's changes break. Say nothing about it when it is compliant with nothing to report. Then, this loop runs unattended, so never ask the end-of-epic AI feedback here: run `uv run .claude/skills/agent-scrooge/scripts/ai_feedback.py {project-root} pending` (resolve {project-root} to the project folder) and, if it lists any epic, only mention in your summary that those epics are finished and waiting for the team to rate the AI (the next interactive build, the epic retrospective or Scrooge McDuck will ask). Then check whether the project's delivery is finished: read the sprint status (_bmad-output/implementation-artifacts/sprint-status.yaml, or wherever the project keeps sprint-status.yaml). Only if every epic and every story in it is done, and the project has not been closed out yet (no estimate model *.estimate.json in the org config's cost_estimates_folder, default docs/costing, has a close_out entry), ask the user once whether Scrooge McDuck (the agent-scrooge skill) should close out the project now: how long it took from the first BMad stage to the last epic, the total Claude API calls and their cost at Claude's list prices, added to the cost estimate workbook for the dashboard. Suggest a fresh session (/clear, then 'Scrooge, close out the project'); start Scrooge here only on an explicit yes. If anything is still open, or the close-out exists, say nothing about it."
