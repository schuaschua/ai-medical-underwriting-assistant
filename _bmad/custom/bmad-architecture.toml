# Org Kit override (org-setup). Before the architecture begins, checks for the architecture answers and principles
# Da Vinci settles with the user (docs/architecture/architecture.md, with one file per cloud provider beside it) and sends the user
# to Da Vinci when there are none. Loads every .md in the architecture folder and the org and project standards as
# persistent facts. Once the architecture is done, offers the architecture diagrams (Da Vinci), the governance
# assessments (Jules) and the cost estimate (Scrooge McDuck).
[workflow]
activation_steps_prepend = [
  "Check for the architecture file at docs/architecture/architecture.md (relative to the project root). If it exists, say in one line that the architecture will follow it and the per-cloud-provider files beside it (for example azure.md or aws.md): the Context answers are settled inputs, every principle (P-1, P-2 ...) is a constraint, each AD honours it or names the principle it departs from and why, and the open questions stay open until the user answers them. If it does not exist, stop before starting the architecture and tell the user that Da Vinci (the agent-davinci skill) settles the architecture questions and guardrails with them first, asking only what the project's documents leave open. He asks six questions (where it runs and how it connects; rules and priorities; solution shape and stack; data and AI; DevOps build and deploy; DevOps environments and release), or picks the answers for them, or skips to what the documents say, as they choose. He writes the answers to docs/architecture/architecture.md, with a file per cloud provider, for this workflow to follow. Suggest a fresh session (/clear, then 'Da Vinci, set the architecture principles'), then running bmad-architecture again. Continue without them only if the user explicitly says so, and then record in the spine's open questions that no architecture principles were agreed. In headless mode never stop: continue and record the missing principles as an open question.",
]
persistent_facts = [
  "file:docs/architecture/*.md",
  "file:docs/standards/*.md",
]
on_complete = "The architecture is complete, so three things can now be done from it. Ask the user once, in one message, which they would like: (1) Da Vinci (the agent-davinci skill) draws the architecture diagrams from the spine into the diagrams folder: C4 context, C4 containers, cloud deployment, data flow with trust boundaries and PII, and sequence diagrams for named flows, every box citing its AD, and challenges the spine's gaps and any departure from the architecture principles first; (2) Jules (IT Governance, the agent-jules skill) fills in the Technical Architecture, Data Governance & Privacy and Enterprise AI Risk Assessments in the governance folder; (3) Scrooge McDuck (the agent-scrooge skill) prices the solution into the Excel cost estimate in the costing folder: a sheet per environment, the rate card and the team's mandays, plus infra_cost.csv with the infrastructure OPEX per day, week, month and year. They can pick any of them, all or none. Say that each works best in its own fresh session: run /clear, then say 'Da Vinci, draw the architecture', 'Jules, answer the assessments' or 'Scrooge, estimate the cost'. Da Vinci goes best first when Jules is also chosen, since Jules can cite the diagrams. Start an agent here only on an explicit yes, one at a time; if they decline, tell them they can ask any of them at any time."
