[project]
name = "intake"
version = "0.1.0"
description = "The intake service: owns cases, documents and the stored PDFs (spine AD-4, AD-21)"
requires-python = "==3.13.*"
dependencies = [
    "contracts",
    # Migrations run from the pipeline; the service reads the bundled head at readiness.
    "alembic==1.20.0",
    # Entra sign-in for Blob Storage, PostgreSQL and telemetry.
    "azure-identity==1.26.0",
    "azure-monitor-opentelemetry==1.8.10",
    "azure-storage-blob==12.31.0",
    "fastapi==0.142.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.3",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"
