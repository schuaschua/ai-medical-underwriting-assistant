# Workspace root: one place for tool configuration (ruff, mypy, pytest).
# Members are the shared contracts package, the synthetic data generator, the
# seven services and the bake-off runner (`evals`, which is no service).
[project]
name = "aiunderwriter"
version = "0.0.0"
description = "AI Medical Underwriting Assistant POC: workspace root"
requires-python = "==3.13.*"
dependencies = ["classification", "contracts", "extraction", "intake", "retrieval", "verdict", "web", "workflow"]

[dependency-groups]
dev = [
    # The test client of the web framework (starlette) is built on httpx2
    # whenever that library is installed, and it is: the model client of
    # `classification` brings it (story 1.8). Tests that name the type of a
    # test client's response name this library's. Same version as uv.lock
    # resolved for the model client.
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    # The synthetic data generator is a dev tool: `uv run python -m synthdata`.
    # It also holds the local stand-in for Azure AI Language (story 1.7),
    # `uv run python -m synthdata.language_standin`, the one for the Foundry
    # model deployments (stories 1.8 and 2.2),
    # `uv run python -m synthdata.foundry_standin`, and the one for Document
    # Intelligence's layout model (story 2.2),
    # `uv run python -m synthdata.layout_standin`; no service depends on it.
    "synthdata",
    # The bake-off runner (story 3.4), `uv run python -m bakeoff`: a dev tool
    # too. It is in no image and no service depends on it.
    "evals",
    # Type hints for the YAML library the runner reads static-metrics.yaml with.
    "types-pyyaml==6.0.12.20250915",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "evals"]

[tool.uv.sources]
classification = { workspace = true }
contracts = { workspace = true }
evals = { workspace = true }
extraction = { workspace = true }
intake = { workspace = true }
retrieval = { workspace = true }
verdict = { workspace = true }
web = { workspace = true }
workflow = { workspace = true }
synthdata = { workspace = true }

[tool.ruff]
target-version = "py313"
# Lets import sorting tell first-party packages from third-party ones.
src = ["packages/*/src", "services/*/src", "evals/src"]
# BMad and Claude Code tooling is vendored, not project code.
extend-exclude = ["_bmad", "_bmad-output", ".claude"]

[tool.ruff.lint]
# coding-style.md section 1: default rules plus import order, bugbear, pyupgrade, security.
extend-select = ["I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest tests state their expectations with plain `assert`, which S101 forbids.
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
# Every service has a tests/conftest.py. Naming modules by their path from the
# repository root (or from a source root below) keeps those apart.
explicit_package_bases = true
# One entry per package and service: where its importable code starts.
mypy_path = [
    # The bake-off runner and the fake `web` its tests share.
    "evals/src",
    "evals/tests/support",
    "packages/contracts/src",
    "packages/synthdata/src",
    # Helpers shared by the tests that run the services against the stand-ins.
    "packages/synthdata/tests/support",
    "services/classification/src",
    "services/classification/tests/support",
    "services/extraction/src",
    "services/extraction/tests/support",
    "services/intake/src",
    # Test doubles shared by a service's tests (also on pytest's pythonpath).
    "services/intake/tests/support",
    "services/retrieval/src",
    "services/retrieval/tests/support",
    "services/verdict/src",
    "services/verdict/tests/support",
    "services/web/src",
    "services/workflow/src",
    "services/workflow/tests/support",
]

[[tool.mypy.overrides]]
# grpcio ships no type hints. `workflow` touches it only where the Durable
# Task library hands its types through (adapters/scheduler.py).
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "evals"]
# Every service will have its own tests/ folder; importlib mode lets test
# modules in different folders share a file name.
addopts = "--import-mode=importlib --strict-markers"
# With importlib mode a test cannot import a module beside it. Test doubles a
# service's tests share live in its tests/support folder, named here; module
# names in it start with the service's name so that they stay unique.
pythonpath = [
    "evals/tests/support",
    "packages/synthdata/tests/support",
    "services/classification/tests/support",
    "services/extraction/tests/support",
    "services/intake/tests/support",
    "services/retrieval/tests/support",
    "services/verdict/tests/support",
    "services/workflow/tests/support",
]
markers = [
    # Needs the containers of compose.yaml: `docker compose up --detach --wait`.
    # Where a test needs Azure AI Language, the Foundry deployments or
    # Document Intelligence it runs the stand-ins of packages/synthdata, a dev
    # dependency of this workspace (stories 1.7, 1.8 and 2.2).
    "integration: uses the local PostgreSQL, blob emulator, scheduler emulator or a stand-in",
]

[tool.coverage.run]
# What `uv run pytest --cov` measures; each service adds its package here.
source_pkgs = [
    "classification",
    # The bake-off runner: the code of the workspace member `evals`.
    "bakeoff",
    "contracts",
    "extraction",
    "intake",
    "retrieval",
    "synthdata",
    "verdict",
    "web",
    "workflow",
]

[tool.coverage.report]
# coding-style.md rule 25: the one place the threshold lives. Never lower it; add tests.
fail_under = 80
