# Workspace root: one place for tool configuration (ruff, mypy, pytest).
# Members are the shared contracts package and, later, the seven services.
[project]
name = "aiunderwriter"
version = "0.0.0"
description = "AI Medical Underwriting Assistant POC: workspace root"
requires-python = "==3.13.*"
dependencies = ["contracts", "intake", "web", "workflow"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    # The synthetic data generator is a dev tool: `uv run python -m synthdata`.
    "synthdata",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
contracts = { workspace = true }
intake = { workspace = true }
web = { workspace = true }
workflow = { workspace = true }
synthdata = { workspace = true }

[tool.ruff]
target-version = "py313"
# Lets import sorting tell first-party packages from third-party ones.
src = ["packages/*/src", "services/*/src"]
# BMad and Claude Code tooling is vendored, not project code.
extend-exclude = ["_bmad", "_bmad-output", ".claude"]

[tool.ruff.lint]
# coding-style.md section 1: default rules plus import order, bugbear, pyupgrade, security.
extend-select = ["I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest tests state their expectations with plain `assert`, which S101 forbids.
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
# Every service has a tests/conftest.py. Naming modules by their path from the
# repository root (or from a source root below) keeps those apart.
explicit_package_bases = true
# One entry per package and service: where its importable code starts.
mypy_path = [
    "packages/contracts/src",
    "packages/synthdata/src",
    "services/intake/src",
    # Test doubles shared by a service's tests (also on pytest's pythonpath).
    "services/intake/tests/support",
    "services/web/src",
    "services/workflow/src",
    "services/workflow/tests/support",
]

[[tool.mypy.overrides]]
# grpcio ships no type hints. `workflow` touches it only where the Durable
# Task library hands its types through (adapters/scheduler.py).
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
# Every service will have its own tests/ folder; importlib mode lets test
# modules in different folders share a file name.
addopts = "--import-mode=importlib --strict-markers"
# With importlib mode a test cannot import a module beside it. Test doubles a
# service's tests share live in its tests/support folder, named here; module
# names in it start with the service's name so that they stay unique.
pythonpath = ["services/intake/tests/support", "services/workflow/tests/support"]
markers = [
    # Needs the containers of compose.yaml: `docker compose up --detach --wait`.
    "integration: uses the local PostgreSQL, blob emulator or scheduler emulator",
]

[tool.coverage.run]
# What `uv run pytest --cov` measures; each service adds its package here.
source_pkgs = ["contracts", "intake", "synthdata", "web", "workflow"]

[tool.coverage.report]
# coding-style.md rule 25: the one place the threshold lives. Never lower it; add tests.
fail_under = 80
