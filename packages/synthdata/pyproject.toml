[project]
name = "synthdata"
version = "0.1.0"
description = "Generator for the synthetic case PDFs, the underwriting manual and the answer key (CAP-11)"
requires-python = "==3.13.*"
# A dev tool, not service code: no service depends on it or imports it.
dependencies = [
    "contracts",
    # The Language stand-in (story 1.7): an HTTP app over the blob emulator.
    "azure-storage-blob==12.31.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"
