name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same version as the `uv_build` pin in packages/contracts/pyproject.toml.
          version: "0.11.8"
          enable-cache: true

      - name: Install dependencies
        # --locked fails the run when uv.lock is out of date instead of rewriting it.
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy packages/contracts/src packages/contracts/tests

      - name: Test with coverage
        # Test paths, measured packages and the 80% threshold come from pyproject.toml.
        run: uv run pytest --cov
