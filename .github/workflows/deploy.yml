name: deploy

# Builds the service images, applies the `app` stack and smoke-checks the
# result (docs/standards/terraform.md rule 33). Started by hand, on `main`
# only; that manual start is the approval of the plan this run applies.
# The `foundation` stack must already be applied: this workflow does not
# create or change it.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC sign-in to Azure

# One deploy at a time; a second run waits and is never cancelled.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # OIDC workload identity federation: no stored Azure secret. The ids are
  # non-secret repository variables set by infra/bootstrap/state-backend.sh.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  # The commit being deployed names its images.
  TF_VAR_image_tag: ${{ github.sha }}
  FOUNDATION_STACK: infra/demo/foundation
  APP_STACK: infra/demo/app

jobs:
  deploy:
    name: Deploy to demo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The environment's branch policy allows `main` only, and its OIDC subject
    # is the one the deployment identity trusts.
    environment: demo
    defaults:
      run:
        shell: bash
    steps:
      - name: Only the head of main is deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploys run from main only; this run was started on ${GITHUB_REF}."
            exit 1
          fi
          # A run that waited in the queue, or a re-run of an old one, must not
          # put an older commit back.
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::error::This run is for ${GITHUB_SHA}, but main is now at ${head}. Start a new run."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure
        uses: Azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Same version as required_version in each stack's versions.tf.
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Read the registry from the foundation stack
        # Reads that stack's outputs from its state; it plans and changes nothing.
        run: |
          terraform -chdir="$FOUNDATION_STACK" init -no-color -lockfile=readonly
          login_server="$(terraform -chdir="$FOUNDATION_STACK" output -raw container_registry_login_server)"
          if [[ -z "$login_server" ]]; then
            echo "::error::The foundation stack has no registry output. Apply it first (infra/bootstrap/README.md)."
            exit 1
          fi
          {
            echo "REGISTRY_LOGIN_SERVER=${login_server}"
            echo "REGISTRY_NAME=${login_server%%.*}"
          } >> "$GITHUB_ENV"

      - name: Build and push the web image
        # Built inside the registry (ACR Tasks); the context is the repository
        # root because the image needs the uv workspace.
        run: |
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "web:${GITHUB_SHA}" \
            --file services/web/Dockerfile \
            .

      - name: Build and push the intake image
        # The `app` stack runs this image too. Its database migrations are not
        # run here yet: until this workflow has a migration step
        # (terraform.md rule 36), an operator runs them as described in
        # infra/bootstrap/README.md, section 4, and intake reports "not
        # ready" until that is done.
        run: |
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "intake:${GITHUB_SHA}" \
            --file services/intake/Dockerfile \
            .

      - name: Build and push the workflow image
        # The `app` stack runs this image too. As for intake, its migrations
        # are not run here yet: an operator runs them as described in
        # infra/bootstrap/README.md, section 5, and workflow reports "not
        # ready" until that is done.
        run: |
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "workflow:${GITHUB_SHA}" \
            --file services/workflow/Dockerfile \
            .

      - name: Init
        run: terraform -chdir="$APP_STACK" init -no-color -lockfile=readonly

      - name: Plan
        run: terraform -chdir="$APP_STACK" plan -no-color -out=tfplan

      - name: Refuse a plan that destroys or replaces a resource
        # terraform.md rule 33. One kind of entry is let through: the module
        # rolls a new image out by re-sending its "update the template" action,
        # which the plan shows as a replacement of that action. It deletes
        # nothing in Azure.
        run: |
          terraform -chdir="$APP_STACK" show -json tfplan > "$RUNNER_TEMP/plan.json"
          doomed="$(jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete"))
            | select(.type != "azapi_resource_action")
            | "\(.address): \(.change.actions | join(", "))"
          ' "$RUNNER_TEMP/plan.json")"
          if [[ -n "$doomed" ]]; then
            echo "::error::The plan destroys or replaces resources; nothing was applied."
            echo "$doomed"
            exit 1
          fi

      - name: Apply the saved plan
        run: terraform -chdir="$APP_STACK" apply -no-color tfplan

      - name: The new revision is the one serving
        # Read-only. Waits until the latest revision runs this commit's image
        # and is the ready one; an older revision still serving fails the run.
        run: |
          app_id="$(terraform -chdir="$APP_STACK" output -raw web_container_app_id)"
          expected="${REGISTRY_LOGIN_SERVER}/web:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            latest="$(az resource show --ids "$app_id" --query properties.latestRevisionName --output tsv)"
            ready="$(az resource show --ids "$app_id" --query properties.latestReadyRevisionName --output tsv)"
            image="$(az resource show --ids "${app_id}/revisions/${latest}" \
              --query 'properties.template.containers[0].image' --output tsv)"
            if [[ -n "$latest" && "$latest" == "$ready" && "$image" == "$expected" ]]; then
              echo "Revision ${latest} is ready and runs ${image}."
              exit 0
            fi
            echo "Attempt ${attempt}: latest=${latest} ready=${ready} image=${image}"
            sleep 10
          done
          echo "::error::No ready revision runs ${expected}."
          exit 1

      - name: intake runs this commit's image
        # Read-only. intake's latest revision must be this commit's image. It
        # is not required to be ready: readiness needs the database role and
        # the migrations, which are still a manual step
        # (infra/bootstrap/README.md, section 4).
        run: |
          app_id="$(terraform -chdir="$APP_STACK" output -raw intake_container_app_id)"
          expected="${REGISTRY_LOGIN_SERVER}/intake:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            latest="$(az resource show --ids "$app_id" --query properties.latestRevisionName --output tsv)"
            image=""
            if [[ -n "$latest" ]]; then
              image="$(az resource show --ids "${app_id}/revisions/${latest}" \
                --query 'properties.template.containers[0].image' --output tsv)"
            fi
            if [[ "$image" == "$expected" ]]; then
              echo "intake's latest revision ${latest} runs ${image}."
              exit 0
            fi
            echo "Attempt ${attempt}: latest=${latest} image=${image}"
            sleep 10
          done
          echo "::error::intake's latest revision does not run ${expected}."
          exit 1

      - name: workflow runs this commit's image
        # Read-only, and as for intake: the latest revision must be this
        # commit's image, and is not required to be ready
        # (infra/bootstrap/README.md, section 5).
        run: |
          app_id="$(terraform -chdir="$APP_STACK" output -raw workflow_container_app_id)"
          expected="${REGISTRY_LOGIN_SERVER}/workflow:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            latest="$(az resource show --ids "$app_id" --query properties.latestRevisionName --output tsv)"
            image=""
            if [[ -n "$latest" ]]; then
              image="$(az resource show --ids "${app_id}/revisions/${latest}" \
                --query 'properties.template.containers[0].image' --output tsv)"
            fi
            if [[ "$image" == "$expected" ]]; then
              echo "workflow's latest revision ${latest} runs ${image}."
              exit 0
            fi
            echo "Attempt ${attempt}: latest=${latest} image=${image}"
            sleep 10
          done
          echo "::error::workflow's latest revision does not run ${expected}."
          exit 1

      - name: Smoke check
        # Read-only: the health route, and the SPA's entry page (an image
        # without the built SPA would answer the first and not the second).
        # The retries cover a scale from zero.
        run: |
          url="$(terraform -chdir="$APP_STACK" output -raw web_url)"
          fetch() {
            curl --fail --silent --show-error --max-time 20 \
              --retry 12 --retry-delay 10 --retry-all-errors "$@"
          }
          fetch --output /dev/null "${url}/api/health"
          content_type="$(fetch --output /dev/null --write-out '%{content_type}' "${url}/")"
          if [[ "$content_type" != text/html* ]]; then
            echo "::error::${url}/ answered with content type '${content_type}', not HTML."
            exit 1
          fi

      - name: Say whether intake is ready
        # Read-only, and never fails the run: it ends the run with a notice
        # when intake is not ready, so a green deploy is not read as "uploads work".
        if: ${{ success() }}
        run: |
          app_id="$(terraform -chdir="$APP_STACK" output -raw intake_container_app_id)"
          latest="$(az resource show --ids "$app_id" --query properties.latestRevisionName --output tsv)"
          ready="$(az resource show --ids "$app_id" --query properties.latestReadyRevisionName --output tsv)"
          if [[ -n "$latest" && "$latest" == "$ready" ]]; then
            echo "::notice::intake is ready (revision ${latest})."
          else
            echo "::warning::intake is NOT ready (latest=${latest}, ready=${ready}). Uploads will be answered with 502 until its database role exists and its migrations have run: infra/bootstrap/README.md, section 4."
          fi

      - name: Say whether workflow is ready
        # Read-only, and never fails the run: as for intake, a green deploy
        # must not be read as "cases start".
        if: ${{ success() }}
        run: |
          app_id="$(terraform -chdir="$APP_STACK" output -raw workflow_container_app_id)"
          latest="$(az resource show --ids "$app_id" --query properties.latestRevisionName --output tsv)"
          ready="$(az resource show --ids "$app_id" --query properties.latestReadyRevisionName --output tsv)"
          if [[ -n "$latest" && "$latest" == "$ready" ]]; then
            echo "::notice::workflow is ready (revision ${latest})."
          else
            echo "::warning::workflow is NOT ready (latest=${latest}, ready=${ready}). An uploaded case will be shown as received but not started until its database role exists and its migrations have run: infra/bootstrap/README.md, section 5."
          fi
